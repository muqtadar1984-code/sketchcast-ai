# Railway build config (Nixpacks).
#
# - aptPkgs adds ffmpeg, required by the video pipeline (agent6/agent8 shell out
#   to it; imageio-ffmpeg's bundled binary is the fallback).
# - The [start] cmd launches the worker. It used to launch a Streamlit UI that
#   production overrode from the Railway dashboard, so the repo could not
#   deploy itself and correctness depended on a setting invisible to git.
#   The Streamlit bundle has been deleted.

[phases.setup]
# libraqm: Pillow loads it dynamically at runtime (8.2+) to enable HarfBuzz
# complex-text shaping — required for correct Devanagari (Marathi) and Telugu
# slide text. Without it those scripts render with misplaced vowel signs.
aptPkgs = ["ffmpeg", "libraqm0", "libfribidi0", "libharfbuzz0b"]

[start]
cmd = "python -m worker.run"
