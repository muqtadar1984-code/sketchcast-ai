# Railway build config (Nixpacks).
#
# - aptPkgs adds ffmpeg, required by the video pipeline (agent6/agent8 shell out
#   to it; imageio-ffmpeg's bundled binary is the fallback).
# - The [start] cmd below launches the legacy Streamlit UI. The PRODUCTION
#   worker service overrides its start command in the Railway dashboard to:
#       python -m worker.run
#   If no service still uses the Streamlit UI, switch this cmd to the worker
#   command — check the Railway dashboard before changing it.

[phases.setup]
aptPkgs = ["ffmpeg"]

[start]
cmd = "streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false"
